[package]
name = "markion"
version = "0.8.3"
edition = "2021"

[lib]
name = "markion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
sha2 = "0.10"
pathdiff = "0.2"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
