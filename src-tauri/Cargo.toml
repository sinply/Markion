[package]
name = "markion"
version = "0.15.3"
edition = "2021"

[lib]
name = "markion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"
sha2 = "0.10"
pathdiff = "0.2"
walkdir = "2"
trash = "5"
regex = "1"
base64 = "0.22"
# Read-model projection of the vault (documents/properties/tags) backing the
# library home and folder table views. The DB is a disposable cache: the .md
# files remain the single source of truth.
rusqlite = { version = "0.32", features = ["bundled"] }

[dev-dependencies]
tempfile = "3"
